[project]
name = "contour-code-atlas"
version = "0.1.0"
description = "Source-only Python/TypeScript architecture and change-impact exploration"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "httpx"]
[dependency-groups]
dev = ["pytest", "ruff"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
[tool.ruff]
# Pinned third-party source is input data, never rewritten by our linter.
extend-exclude = ["data", "examples/corpus"]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I"]
